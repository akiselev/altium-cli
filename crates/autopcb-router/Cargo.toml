[package]
name = "autopcb-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lints]
workspace = true

[dependencies]
altium-format-types = { version = "0.2.0", path = "../altium-format-types" }
autopcb-ir = { path = "../autopcb-ir" }
autopcb-routes = { path = "../autopcb-routes" }

petgraph = "0.6"
pathfinding = "4"
rstar = "0.12"
geo = "0.28"
bitvec = "1"
rayon = "1"
good_lp = { version = "1", default-features = false, features = ["minilp"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
ordered-float = "4"
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
solverang = { path = "../../../solverang/crates/solverang", optional = true }

[features]
default = []
gpu = ["wgpu", "pollster"]
gpu-tests = ["gpu"]
solverang = ["dep:solverang"]
proptest = []

[dev-dependencies]
proptest = "1"
