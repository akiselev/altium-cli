[package]
name = "altium-format-types"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

description = "Type definitions, enums, and constants for the Altium Designer file format."
license = "Apache-2.0"
repository = "https://github.com/akiselev/altium-cli"
homepage = "https://github.com/akiselev/altium-cli"
documentation = "https://docs.rs/altium-format-types"
readme = "README.md"
authors = ["Alexander Kiselev <alex@akiselev.com>"]
keywords = ["altium", "eda", "pcb", "schematic", "types"]
categories = ["data-structures"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
