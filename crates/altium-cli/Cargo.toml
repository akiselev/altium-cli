[package]
name = "altium-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

description = "CLI tool for inspecting and manipulating Altium Designer files"
license = "Apache-2.0"
repository = "https://github.com/akiselev/altium-cli"
homepage = "https://github.com/akiselev/altium-cli"
documentation = "https://docs.rs/altium-cli"
readme = "README.md"
authors = ["Alexander Kiselev <alex@akiselev.com>"]
keywords = ["altium", "eda", "pcb", "schematic", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "altium"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
altium-format = { version = "0.2.0", path = "../altium-format" }
altium-format-query = { version = "0.2.0", path = "../altium-format-query" }
autopcb-spec = { version = "0.1.0", path = "../../../autopcb/crates/autopcb-spec", features = ["altium-apply"] }
altium-format-render-svg = { version = "0.2.0", path = "../altium-format-render-svg" }
altium-format-render-png = { version = "0.2.0", path = "../altium-format-render-png" }
altium-format-types = { version = "0.2.0", path = "../altium-format-types" }
autopcb-graph = { version = "0.1.0", path = "../../../autopcb/crates/autopcb-graph" }
autopcb-graph-spec = { version = "0.1.0", path = "../../../autopcb/crates/autopcb-graph-spec" }
autopcb-graph-import-altium = { version = "0.1.0", path = "../../../autopcb/crates/autopcb-graph-import-altium" }
autopcb-ir = { version = "0.2.0", path = "../../../autopcb/crates/autopcb-ir", features = ["serde", "pcbdoc-import"] }
autopcb-placement = { version = "0.2.0", path = "../../../autopcb/crates/autopcb-placement" }
autopcb-router = { version = "0.1.0", path = "../../../autopcb/crates/autopcb-router" }
autopcb-routes = { version = "0.2.0", path = "../../../autopcb/crates/autopcb-routes" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
anyhow = "1.0.102"
cfb = "0.12.1"
encoding_rs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
test-fixtures = []
proptest = ["test-fixtures"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
