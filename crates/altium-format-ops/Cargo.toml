[package]
name = "altium-format-ops"
version = "0.1.8"
edition = "2024"
rust-version = "1.85"

description = "High-level operations for Altium Designer files (CLI business logic)."
license = "GPL-3.0-only"
repository = "https://github.com/akiselev/altium-cli"
homepage = "https://github.com/akiselev/altium-cli"
authors = ["Alexander Kiselev <alex@akiselev.com>"]

[lints]
workspace = true

[dependencies]
altium-format = { version = "0.1.8", path = "../altium-format" }
altium-format-types = { version = "0.1.8", path = "../altium-format-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
cfb = "0.12.1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
altium-format-derive = { version = "0.1.8", path = "../altium-format-derive" }

[dev-dependencies]
tempfile = "3"
proptest = "1"
