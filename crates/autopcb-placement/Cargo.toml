[package]
name = "autopcb-placement"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[lints]
workspace = true

[features]
## Enable the congestion oracle integration point.
## When this feature is active the placement SA cost function can accept an
## external `CongestionGrid` from `autopcb-router` and use it as a penalty term.
routing = ["dep:autopcb-router"]

[dependencies]
autopcb-ir = { version = "0.2.0", path = "../autopcb-ir" }
solverang = { path = "../../../solverang/crates/solverang", default-features = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
rand = "0.9"
tracing = "0.1"
autopcb-router = { path = "../autopcb-router", optional = true }
