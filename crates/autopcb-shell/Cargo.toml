[package]
name = "autopcb-shell"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[lints]
workspace = true

[dependencies]
autopcb-ir = { version = "0.2.0", path = "../autopcb-ir" }
autopcb-placement = { version = "0.2.0", path = "../autopcb-placement" }
altium-format = { version = "0.2.0", path = "../altium-format" }
altium-format-spec = { version = "0.2.0", path = "../altium-format-spec" }
altium-format-render-png = { version = "0.2.0", path = "../altium-format-render-png" }
efame = { package = "eframe", version = "0.33", features = ["wgpu", "persistence"] }
egui_tiles = { version = "0.14", features = ["serde"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
