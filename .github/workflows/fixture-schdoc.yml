name: Fixtures SchDoc

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fixture-schdoc:
    name: SchDoc fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Fetch SchDoc fixtures
        run: |
          set -euo pipefail
          mkdir -p data
          rm -rf data/schdoc
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-schdoc data/schdoc

      - name: Run altium-format SchDoc fixture tests
        run: cargo test -p altium-format --lib schdoc --features test-fixtures --verbose
