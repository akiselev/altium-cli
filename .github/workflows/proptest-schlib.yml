name: Proptest SchLib

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  proptest-schlib:
    name: SchLib proptests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Fetch SchLib fixtures
        run: |
          set -euo pipefail
          mkdir -p data
          rm -rf data/schlib
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-schlib data/schlib

      - name: Run altium-format SchLib proptests
        run: cargo test -p altium-format --lib prop_schlib --features proptest --verbose
