name: Agent sync-v2 validation

on:
  push:
    branches:
      - agent/bidirectional-sync-v2

concurrency:
  group: agent-sync-v2-validation
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test synchronization crates
        run: cargo test -p altium-spec-lang -p altium-sync -p altium-cli

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy synchronization crates
        run: cargo clippy -p altium-spec-lang -p altium-sync -p altium-cli --all-targets --no-deps -- -D warnings
