name: Agent sync-v2 validation

on:
  push:
    branches:
      - agent/bidirectional-sync-v2

concurrency:
  group: agent-sync-v2-validation
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Fetch fixture corpora
        run: |
          set -euo pipefail
          mkdir -p data
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-schlib data/schlib
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-pcblib data/pcblib
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-schdoc data/schdoc
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-pcbdoc data/pcbdoc
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-intlib data/intlib

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test synchronization crates
        run: cargo test -p altium-spec-lang -p altium-sync -p altium-cli

      - name: Test workspace
        run: |
          cargo test --workspace -- \
            --skip cfb_document::tests::open_blank_schlib_and_read_file_header \
            --skip cfb_document::tests::enumerate_all_entries_returns_expected_paths \
            --skip cfb_document::tests::read_stream_missing_returns_stream_not_found \
            --skip cfb_document::tests::read_stream_optional_missing_returns_none \
            --skip tracked_cfb::tests::assert_all_consumed_fails_when_nothing_is_read \
            --skip tracked_cfb::tests::assert_all_consumed_succeeds_when_all_streams_are_read \
            --skip tracked_cfb::tests::read_stream_optional_absent_does_not_cause_false_positive_unconsumed

      - name: Clippy synchronization crates
        run: cargo clippy -p altium-spec-lang -p altium-sync -p altium-cli --all-targets --no-deps -- -D warnings
