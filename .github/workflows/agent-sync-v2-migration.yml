name: Agent sync-v2 validation

on:
  push:
    branches:
      - agent/bidirectional-sync-v2

permissions:
  contents: write

concurrency:
  group: agent-sync-v2-validation
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Format workspace
        run: cargo fmt --all

      - name: Commit formatting if needed
        run: |
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add crates/altium-cli/src/sync_v2.rs crates/altium-spec-lang crates/altium-sync crates/altium-cli/src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m "Format sync v2 implementation"
            git pull --rebase origin agent/bidirectional-sync-v2
            git push origin HEAD:agent/bidirectional-sync-v2
            exit 0
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test synchronization crates
        run: cargo test -p altium-spec-lang -p altium-sync -p altium-cli

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy synchronization crates
        run: cargo clippy -p altium-spec-lang -p altium-sync -p altium-cli --all-targets --no-deps -- -D warnings
