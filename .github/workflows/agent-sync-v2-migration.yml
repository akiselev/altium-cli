name: Agent sync-v2 validation

on:
  push:
    branches:
      - agent/bidirectional-sync-v2

permissions:
  contents: write

concurrency:
  group: agent-sync-v2-validation
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Fetch fixture corpora
        run: |
          set -euo pipefail
          mkdir -p data
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-schlib data/schlib
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-pcblib data/pcblib
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-schdoc data/schdoc
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-pcbdoc data/pcbdoc
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-intlib data/intlib

      - name: Refine exact document plans
        run: python3 scripts/refine_exact_plan.py

      - name: Format workspace
        run: cargo fmt --all

      - name: Commit generated product changes if needed
        run: |
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          cargo metadata --format-version 1 >/dev/null
          git add Cargo.lock crates/altium-cli crates/altium-spec-lang crates/altium-sync
          if ! git diff --cached --quiet; then
            git commit -m "Make saved document plans exact binary patches"
            git pull --rebase origin agent/bidirectional-sync-v2
            git push origin HEAD:agent/bidirectional-sync-v2
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test synchronization crates
        run: cargo test -p altium-spec-lang -p altium-sync -p altium-cli

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy synchronization crates
        run: cargo clippy -p altium-spec-lang -p altium-sync -p altium-cli --all-targets --no-deps -- -D warnings
