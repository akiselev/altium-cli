name: Fixtures SchLib

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fixture-schlib:
    name: SchLib fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Fetch SchLib fixtures
        run: |
          set -euo pipefail
          mkdir -p data
          rm -rf data/schlib
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-schlib data/schlib

      - name: Run SchLib e2e ops tests
        run: cargo test -p altium-format-ops --test ops_e2e_schlib --features test-fixtures --verbose
