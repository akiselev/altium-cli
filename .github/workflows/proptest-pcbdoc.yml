name: Proptest PcbDoc

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  proptest-pcbdoc:
    name: PcbDoc proptests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Fetch PcbDoc fixtures
        run: |
          set -euo pipefail
          mkdir -p data
          rm -rf data/pcbdoc
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-pcbdoc data/pcbdoc

      - name: Fetch PcbLib fixtures
        run: |
          set -euo pipefail
          rm -rf data/pcblib
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-pcblib data/pcblib

      - name: Run altium-format PcbDoc proptests
        run: cargo test -p altium-format --lib prop_pcbdoc --features proptest --verbose

      - name: Run altium-format-ops PCB proptests
        run: cargo test -p altium-format-ops --test executor_pcb_proptest --features proptest --verbose
