name: Proptest Parser

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  proptest-parser:
    name: Parser & CLI proptests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run parser proptests
        run: cargo test -p altium-format-ops --lib prop_ --features proptest --verbose

      - name: Run CLI proptests
        run: cargo test -p altium-cli --lib --features proptest --verbose
