name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: altium-cli-linux-x86_64
            binary: altium-cli
          - os: macos-latest
            artifact: altium-cli-macos-x86_64
            binary: altium-cli
          - os: windows-latest
            artifact: altium-cli-windows-x86_64.exe
            binary: altium-cli.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p altium-cli

      - name: Copy binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/release/${{ matrix.binary }} ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        run: |
          copy target\release\${{ matrix.binary }} ${{ matrix.artifact }}
          certUtil -hashfile ${{ matrix.artifact }} SHA256 > ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            altium-cli-linux-x86_64/altium-cli-linux-x86_64
            altium-cli-linux-x86_64/altium-cli-linux-x86_64.sha256
            altium-cli-macos-x86_64/altium-cli-macos-x86_64
            altium-cli-macos-x86_64/altium-cli-macos-x86_64.sha256
            altium-cli-windows-x86_64.exe/altium-cli-windows-x86_64.exe
            altium-cli-windows-x86_64.exe/altium-cli-windows-x86_64.exe.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
