name: Fixtures PcbLib

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fixture-pcblib:
    name: PcbLib fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Fetch PcbLib fixtures
        run: |
          set -euo pipefail
          mkdir -p data
          rm -rf data/pcblib
          git clone --depth 1 https://github.com/akiselev/altium-cli-test-pcblib data/pcblib

      - name: Run altium-format PcbLib fixture tests
        run: cargo test -p altium-format --lib pcblib --features test-fixtures --verbose
